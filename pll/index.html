<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>SCHEME NORTENOS-14</title>
<style>
body {margin:0;font-family:Arial;color:white;display:flex;height:100vh;background:url('kk.png') no-repeat center center fixed;background-size:cover;position: relative;}
body::after {content:"";position:fixed;top:0;left:0;width:100%;height:100%;background: rgba(0,0,0,0.5);z-index:0;}
#main,#sidebar{position:relative;z-index:1;}
#sidebar{width:180px;background:#111;display:flex;flex-direction:column;box-shadow:2px 0 5px black;}
#sidebar button{background:#111;color:white;border:none;padding:15px;text-align:left;cursor:pointer;font-weight:bold;}
#sidebar button:hover{background:red;}
#sidebar button.active{background:darkred;}
#main{flex:1;padding:20px;overflow-y:auto;}
.container{background:#111;padding:15px;border-radius:8px;margin-bottom:15px;}
input,select{width:90%;padding:8px;margin:5px;border:none;border-radius:6px;background:#1a1a1a;color:white;}
button{background:red;color:white;border:none;padding:8px;margin:5px;width:95%;font-weight:bold;cursor:pointer;border-radius:6px;}
button:hover{background:darkred;}
table{width:100%;border-collapse:collapse;background:#111;}
th,td{border:1px solid red;padding:8px;text-align:center;}
th{background:red;color:black;}
.taskItem{display:flex;justify-content:space-between;padding:5px;margin:3px 0;border:1px solid red;border-radius:6px;}
.taskItem.approved{background:darkgreen;color:white;}
.historyItem{background:#222;border:1px solid red;border-radius:6px;padding:8px;margin:5px 0;font-family:'Courier New', monospace;display:flex;justify-content:space-between;}
.historyDate{color:lightgray;font-size:0.8em;}
.historyActivity{font-weight:bold;}
.historyPoints{color:lime;font-weight:bold;}
</style>
</head>
<body>

<div id="sidebar">
  <button class="tabBtn active" onclick="showTab('homeTab')">Home</button>
  <button class="tabBtn" onclick="showTab('profilTab')">Profil</button>
  <button class="tabBtn" onclick="showTab('clasamentTab')">Clasament</button>
  <button class="tabBtn" onclick="showTab('membersTab')">Membrii</button>
  <button class="tabBtn" id="adminTabBtn" style="display:none;" onclick="showTab('adminTab')">Admin</button>
</div>

<div id="main">

<div id="homeTab" class="tab">
  <div class="container">
    <h2>Profil</h2>
    <p><b>Nume:</b> <span id="homeName">-</span></p>
    <p><b>Puncte:</b> <span id="homePoints">0</span></p>
    <button onclick="clearHistoryVisual()">Clear Istoric Vizual</button>
  </div>
  <div class="container">
    <h2>Predare Task</h2>
    <input type="number" id="taskAmount" placeholder="Puncte task">
    <input type="text" id="taskMember" placeholder="Nume membru">
    <button onclick="submitTask()">Predă Task</button>
    <div id="taskPending"></div>
  </div>
  <div class="container">
    <h2>Ultimele puncte</h2>
    <div id="lastPoints"></div>
  </div>
</div>

<div id="profilTab" class="tab" style="display:none;">
  <div class="container">
    <h2>Profil</h2>
    <p><b>Nume:</b> <span id="profileName">-</span></p>
    <p><b>Puncte:</b> <span id="profilePoints">0</span></p>
    <button onclick="clearHistoryVisual()">Clear Istoric Vizual</button>
    <h3>Istoric activități</h3>
    <div id="profileHistory"></div>
  </div>
</div>

<div id="clasamentTab" class="tab" style="display:none;">
  <div class="container">
    <h2>Clasament Oficial</h2>
    <table>
      <thead>
        <tr><th>#</th><th>Membru</th><th>Puncte</th></tr>
      </thead>
      <tbody id="leaderboard"></tbody>
    </table>
  </div>
</div>

<div id="membersTab" class="tab" style="display:none;">
  <div class="container">
    <h2>Membrii</h2>
    <table>
      <thead>
        <tr><th>#</th><th>Nume</th><th>Mafie</th><th>Gang</th></tr>
      </thead>
      <tbody id="membersList"></tbody>
    </table>
  </div>
</div>

<div id="adminTab" class="tab" style="display:none;">
  <div class="container">
    <h2>Panou Admin</h2>
    <h3>Adaugă / Scoate puncte</h3>
    <select id="memberSelect"></select>
    <input type="number" id="pointsInput" placeholder="Puncte (poate fi negativ)">
    <button onclick="givePoints()">Aplică puncte</button>

    <h3>Schimbă faction membru</h3>
    <select id="factionMemberSelect"></select>
    <select id="factionSelect">
      <option value="Mafie">Mafie</option>
      <option value="Gang">Gang</option>
    </select>
    <button onclick="changeFaction()">Aplică faction</button>

    <h3>Șterge cont membru</h3>
    <select id="deleteSelect"></select>
    <button onclick="deleteUser()">Șterge cont</button>

    <h3>Adaugă Admin</h3>
    <select id="addAdminSelect"></select>
    <button onclick="addAdmin()">Dă Admin</button>

    <h3>Clear Istoric Vizual</h3>
    <button onclick="clearHistoryVisual()">Clear Istoric Vizual</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyB3EZvNjLUNWw8mruH1voXl_sf16cEFoVs",
    authDomain: "nortenos-bf806.firebaseapp.com",
    databaseURL: "https://nortenos-bf806-default-rtdb.firebaseio.com",
    projectId: "nortenos-bf806",
    storageBucket: "nortenos-bf806.appspot.com",
    messagingSenderId: "274141810949",
    appId: "1:274141810949:web:c52c49206ae80701eb676c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
// USERS & DATA
let users = [];
let currentUser = null;
let lastPointsList = [];

// TABURI
function showTab(tabId){
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
  document.getElementById(tabId).style.display='block';
  document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

// LOAD DATA FROM FIREBASE
db.ref('users').once('value').then(snapshot=>{
  const data = snapshot.val();
  if(data){
    users = Object.values(data);
    currentUser = users.find(u=>u.isAdmin) || users[0];
    showAdminIfNeeded();
    updateProfile();
    updateLeaderboard();
    updateAdminSelects();
    updateMembersList();
  } else {
    users.push({username:"vlad",password:"vlad2020",points:0,history:[],verified:true,isAdmin:true,faction:"Gang"});
    currentUser = users[0];
    saveAllUsersToFirebase();
    showAdminIfNeeded();
    updateProfile();
    updateLeaderboard();
    updateAdminSelects();
    updateMembersList();
  }
});

function saveAllUsersToFirebase(){users.forEach(u=>db.ref('users/'+u.username).set(u));}
function showAdminIfNeeded(){if(currentUser.isAdmin) document.getElementById('adminTabBtn').style.display='block';}

function updateProfile(){
  document.getElementById('profileName').textContent=currentUser.username;
  document.getElementById('profilePoints').textContent=currentUser.points;
  document.getElementById('homeName').textContent=currentUser.username;
  document.getElementById('homePoints').textContent=currentUser.points;
  const historyContainer=document.getElementById('profileHistory');
  historyContainer.innerHTML="";
  currentUser.history.forEach(h=>{
    const div=document.createElement('div');
    div.className='historyItem';
    div.innerHTML=`<span class="historyDate">${h.date}</span><span class="historyActivity">${h.activity}</span><span class="historyPoints">${h.points>=0?'+':''}${h.points}</span>`;
    historyContainer.appendChild(div);
  });
}
function clearHistoryVisual(){document.getElementById('profileHistory').innerHTML="";alert("Istoric vizual curățat!");}
function updateLeaderboard(){
  const leaderboard=document.getElementById('leaderboard'); leaderboard.innerHTML="";
  users.sort((a,b)=>b.points-a.points).forEach((u,i)=>leaderboard.innerHTML+=`<tr><td>${i+1}</td><td>${u.username}</td><td>${u.points}</td></tr>`);
}
function updateMembersList(){
  const membersList=document.getElementById('membersList');
  const factionMemberSelect=document.getElementById('factionMemberSelect');
  membersList.innerHTML=""; factionMemberSelect.innerHTML="";
  users.forEach((u,i)=>{
    membersList.innerHTML+=`<tr><td>${i+1}</td><td>${u.username}</td><td>${u.faction==="Mafie"?"✅":""}</td><td>${u.faction==="Gang"?"✅":""}</td></tr>`;
    factionMemberSelect.innerHTML+=`<option>${u.username}</option>`;
  });
}
function updateAdminSelects(){
  const memberSelect=document.getElementById('memberSelect');
  const deleteSelect=document.getElementById('deleteSelect');
  const addAdminSelect=document.getElementById('addAdminSelect');
  memberSelect.innerHTML=""; deleteSelect.innerHTML=""; addAdminSelect.innerHTML="";
  users.forEach(u=>{
    memberSelect.innerHTML+=`<option>${u.username}</option>`;
    deleteSelect.innerHTML+=`<option>${u.username}</option>`;
    if(!u.isAdmin) addAdminSelect.innerHTML+=`<option>${u.username}</option>`;
  });
}

// ADMIN ACTIONS
function givePoints(){
  const member=users.find(u=>u.username===document.getElementById('memberSelect').value);
  const pts=parseInt(document.getElementById('pointsInput').value);
  if(!member||isNaN(pts)){alert("Completează corect!");return;}
  member.points+=pts;
  member.history.push({activity:"Puncte Admin",points:pts,date:new Date().toLocaleString()});
  saveAllUsersToFirebase(); updateProfile(); updateLeaderboard(); updateAdminSelects(); updateMembersList(); alert("Puncte aplicate!");
}
function changeFaction(){
  const memberName=document.getElementById('factionMemberSelect').value;
  const faction=document.getElementById('factionSelect').value;
  const member=users.find(u=>u.username===memberName);
  if(member){member.faction=faction; saveAllUsersToFirebase(); updateMembersList(); alert(memberName+" este acum în "+faction);}
}
function deleteUser(){const memberName=document.getElementById('deleteSelect').value;users=users.filter(u=>u.username!==memberName);saveAllUsersToFirebase();updateLeaderboard();updateAdminSelects();updateMembersList();alert("Cont șters!");}
function addAdmin(){const memberName=document.getElementById('addAdminSelect').value;const u=users.find(x=>x.username===memberName);if(u){u.isAdmin=true;saveAllUsersToFirebase();alert(memberName+" este acum admin!");updateAdminSelects();}}

// TASKS
function submitTask(){
  const amount=parseInt(document.getElementById('taskAmount').value);
  const name=document.getElementById('taskMember').value.trim();
  if(!amount||!name){alert("Completează corect!");return;}
  const member=users.find(u=>u.username===name);
  if(member){
    member.points+=amount;
    member.history.push({activity:"Task predat",points:amount,date:new Date().toLocaleString()});
    saveAllUsersToFirebase();
    updateProfile(); updateLeaderboard(); updateMembersList(); alert("Task predat și puncte adăugate!");
  } else {alert("Membru inexistent!");}
}
</script>

</body>
</html>
